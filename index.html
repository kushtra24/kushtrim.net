<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Kushtrim Ramadani — Senior Frontend &amp; Emerging Tech Lead building accessible, scalable frontends and agentic AI tools.">
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
    <title>Kushtrim Ramadani</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Only these icons are downloaded (alphabetical order required). Keep in sync with src/components/AppIcon.vue. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=arrow_back,arrow_forward,check,check_circle,content_copy,download,expand_less,expand_more,location_on,mail,share,shop,terminal&display=block" rel="stylesheet">
    <script>
      // Apply the theme before first paint to avoid a flash. Keep in sync with src/composables/useTheme.ts.
      (function () {
        var theme
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
