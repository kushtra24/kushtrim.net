[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Same Node version as local development (nvm).
  NODE_VERSION = "24.16.0"

# Single-page app: let vue-router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite puts a content hash in every file name under /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
